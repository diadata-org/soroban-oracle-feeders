version: '3'

services:
  oracle:
    container_name: oracle-feeder
    build:
      context: .
      dockerfile: ./apps/oracle/Dockerfile
    restart: always
    env_file:
      - ./apps/oracle/.env
    volumes:
      - midnight-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
